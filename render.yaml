services:
  - type: web
    name: designsystems
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: design_system_index
      - key: EMBEDDING_MODEL
        value: jina-embeddings-v2-base-en
      - key: EMBEDDING_DIM
        value: "768"
