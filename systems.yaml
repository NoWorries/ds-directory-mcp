# Registry of external design systems to crawl and index.
# Add an entry per system: 'organization' (blank if there isn't a distinct one),
# 'design_system' name, and one or more start URLs to crawl from. A crawl
# only follows links under the start URL's own path (its "children"); set
# 'scope_paths' (a list of path prefixes) to widen or pin that when the
# start URL is a landing page deeper than the system's real root.
#
# 'resources', 'pages_indexed', 'etag', 'last_modified', 'last_checked',
# 'consecutive_crawl_failures', 'thin_page_ratio', and any '*_meta' fields
# are auto-populated by ingest.py — don't hand-edit them, your changes will
# be overwritten on the next run. A missing 'pages_indexed' means the entry
# has never been indexed (picked up by `ingest.py --new`).
# 'thin_page_ratio' is the fraction of fetched pages that had too little
# content to embed (1 - pages_indexed/fetched) — high alongside a real
# fetch count usually means a mostly client-side-rendered site, not a
# small one; see 'likely_spa'.
# 'consecutive_crawl_failures' counts how many checks IN A ROW the start
# URL couldn't be fetched at all — resets to 0
# the moment a check succeeds; check_crawl_health.py uses a run of these to
# flag a system as a real archival candidate rather than just currently having
# a bad day.
#
# 'render_mode: spa' is set the first time `ingest.py --spa` successfully
# renders a system's content through a headless browser — it's sticky (unlike
# 'likely_spa', which a successful render clears), so `--all`'s plain HTTP
# crawl permanently skips it instead of re-attempting a fetch that can't
# execute JS, finding nothing, and deleting the vectors the render wrote.
#
# 'archived: true' is a graveyard marker for a system whose docs site is
# confirmed gone with no live replacement — set by hand after investigating,
# never by ingest.py. Comes with three companion fields:
#   archived_status: one of shut_down / acquired / repo_archived /
#     deliberately_removed / unmaintained — the category of "why it's gone"
#   archived_reason: a short free-text note on what was actually checked
#   archived_date: the date (YYYY-MM-DD) that check was done, since a site
#     confirmed dead once can always come back — this is an "as of", not a
#     permanent verdict
# ingest.py skips these entirely (--all/--new/--spa), and they never appear
# on the public site (generate_directory.py's indexed_only() excludes
# anything without pages_indexed regardless). Kept in the registry rather
# than deleted so a future contributor re-submitting the same dead system
# gets caught by name instead of silently re-added.

