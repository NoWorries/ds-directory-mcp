name: Build and deploy site (no crawling)

# Builds directory.html/components/systems purely from whatever is already in
# systems.yaml + pages_index.json right now — no ingest.py, no Qdrant, no embedding API.
# Useful for: deploying a design/template change without waiting for a crawl,
# recovering the site after a reindex run's build step failed partway through,
# or just seeing the site in its current (even empty, pre-first-crawl) state.

on:
  push:
    branches: [master]
    paths:
      - generate_directory.py
      - generate_components.py
      - generate_systems.py
      - generate_home.py
      - generate_search.py
      - generate_forms.py
      - generate_llms_txt.py
      - generate_data_export.py
      - generate_sitemap.py
      - generate_mcp_manifest.py
      - generate_security_txt.py
      - generate_robots_txt.py
      - page_shell.py
      - text_utils.py
      - component_taxonomy.py
      - slug.py
      - systems.yaml
      - pages_index.json
  workflow_dispatch: {}

permissions:
  contents: read

# Only one of these full-registry pipelines (reindex-full/new/shallow/
# signals-refresh/spa, plus this one) committing to master or deploying to
# Netlify at once — running two at a time doubled embedding-API 429s in practice
# and made their push-retry loops fight each other for no benefit.
concurrency:
  group: ds-directory-mcp-write-pipeline
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-site.txt

      # Only PyYAML is needed to build the pages — requests/bs4/qdrant-client
      # (the rest of requirements.txt) are for ingest.py's crawling, not this.
      - run: pip install -r requirements-site.txt

      - name: Generate site pages from current systems.yaml/pages_index.json
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          python generate_home.py
          python generate_search.py
          python generate_forms.py
          python generate_data_export.py
          python generate_llms_txt.py
          python generate_mcp_manifest.py
          python generate_security_txt.py
          python generate_robots_txt.py
          python generate_directory.py
          python generate_components.py
          python generate_systems.py
          # sitemap.xml must run AFTER components/patterns/foundations are
          # generated above — it enumerates those directories' pages
          # (taxonomy_page_paths() in generate_sitemap.py).
          python generate_sitemap.py

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          bash scripts/build_site.sh
