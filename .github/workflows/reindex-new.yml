name: Reindex new design systems

on:
  schedule:
    # Weekly (Mondays) at 04:00 UTC — a safety net for anything added straight to
    # systems.yaml by hand. Systems approved via the submission flow already get
    # ingested immediately by submission-approve.yml, so this doesn't need to be
    # daily. reindex-full.yml (monthly) re-crawls everything already indexed.
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  # One shard per never-indexed system (capped at 256 — GitHub's hard
  # matrix-size limit), same rationale as reindex-full.yml/reindex-shallow.yml:
  # a shard's local progress only survives if it reaches its own end-of-job
  # artifact upload, and a forced runner shutdown (GitHub killing the VM
  # outright, not just failing a step) gives it no chance to run that step at
  # all. This job used to run --new as a single unsharded process, which had
  # the exact same "one kill loses everything since the last run" exposure
  # the other two reindex workflows had before they were sharded.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      shard_count: ${{ steps.gen.outputs.shard_count }}
      shards: ${{ steps.gen.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ingest.txt
      - run: pip install PyYAML
      - id: gen
        run: |
          python3 -c "
          import json
          import yaml

          with open('systems.yaml') as f:
              entries = yaml.safe_load(f) or []
          total = len([e for e in entries if 'pages_indexed' not in e])
          n = max(min(total, 256), 1)
          print(f'shard_count={n}')
          print(f'shards={json.dumps(list(range(n)))}')
          " >> "$GITHUB_OUTPUT"

  reindex-new-shard:
    needs: prepare
    strategy:
      fail-fast: false
      # GitHub also enforces a concurrent-jobs limit independent of the
      # Actions-minutes quota — capping how many of these run at once avoids
      # tripping it even with up to 256 shards queued.
      max-parallel: 4
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ingest.txt

      - run: pip install -r requirements-ingest.txt

      - name: Ingest this shard's never-before-indexed systems
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: python ingest.py --new --shard ${{ matrix.shard }}/${{ needs.prepare.outputs.shard_count }}

      # if: always() — ingest.py writes systems.yaml/pages_index.json
      # incrementally per system, well before that system's embedding calls
      # (where a rate-limit or other failure actually happens), so whatever
      # this shard got through before any failure is already on disk and
      # worth uploading.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: |
            systems.yaml
            pages_index.json
          retention-days: 1

  merge-and-deploy:
    needs: [prepare, reindex-new-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ingest.txt

      - run: pip install -r requirements-ingest.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards

      - name: Merge shard results into systems.yaml + pages_index.json
        run: python merge_shards.py ${{ needs.prepare.outputs.shard_count }}

      - name: Generate static directory page
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          python generate_home.py
          python generate_search.py
          python generate_forms.py
          python generate_data_export.py
          python generate_llms_txt.py
          python generate_sitemap.py
          python generate_directory.py
          python generate_components.py
          python generate_systems.py

      - name: Check crawl health (maintainer-facing only — not shown on the public page)
        run: python check_crawl_health.py

      - name: Open/update/close maintainer issue for low-coverage systems
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --search "Crawl health: systems needing attention in:title" --state open --json number --jq '.[0].number')
          if [ -f health_report.md ]; then
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body-file health_report.md
            else
              gh issue create --title "Crawl health: systems needing attention" --body-file health_report.md --label "crawl-health" || \
              gh issue create --title "Crawl health: systems needing attention" --body-file health_report.md
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "All systems now have healthy crawl coverage — closing."
          fi

      - name: Commit discovered resources + directory page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add systems.yaml home.html directory.html search.html suggest.html report.html llms.txt systems.json design-system.schema.json pages_index.json components systems
          if [ -f sitemap.xml ]; then git add sitemap.xml; fi
          if ! git diff --cached --quiet; then
            git commit -m "Auto-index new design systems + update directory page [skip ci]"
            # Other workflows commit to this same branch too, so a push can
            # land after one of them — ordinary non-fast-forward race, not a
            # real conflict most of the time. Rebase and retry a few times.
            for i in 1 2 3 4 5; do
              git push && break
              echo "Push rejected (attempt $i/5) — another commit landed first, rebasing and retrying..."
              git pull --rebase
            done
          else
            echo "No changes to commit"
          fi

      - name: Deploy directory page to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          mkdir -p site
          cp home.html site/index.html
          cp search.html site/search.html
          cp suggest.html site/suggest.html
          cp report.html site/report.html
          cp llms.txt site/llms.txt
          if [ -f sitemap.xml ]; then cp sitemap.xml site/sitemap.xml; fi
          cp systems.json site/systems.json
          cp design-system.schema.json site/design-system.schema.json
          cp directory.html site/directory.html
          if [ -d screenshots ]; then cp -r screenshots site/screenshots; fi
          if [ -d components ]; then cp -r components site/components; fi
          if [ -d systems ]; then cp -r systems site/systems; fi
          npx --yes netlify-cli@17 deploy --site "$NETLIFY_SITE_ID" --dir=site --prod
