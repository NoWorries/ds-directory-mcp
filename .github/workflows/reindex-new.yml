name: Reindex new design systems

on:
  schedule:
    # Weekly (Mondays) at 04:00 UTC — a safety net for anything added straight to
    # systems.yaml by hand. Systems approved via the submission flow already get
    # ingested immediately by submission-approve.yml, so this doesn't need to be
    # daily. reindex-full.yml (monthly) re-crawls everything already indexed.
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  reindex-new:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Ingest any never-before-indexed systems
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: python ingest.py --new

      # Every step below runs with if: always() — ingest.py writes
      # systems.yaml/pages_index.json incrementally per system (well before
      # that system's embedding calls, which is where a mid-run failure like
      # a Jina rate-limit actually happens), so whatever the ingest step above
      # got through before failing is already sitting on disk. Without
      # always(), a failed step skips everything after it by default, so that
      # progress would never get committed and would vanish when the runner
      # is torn down — even though the job log clearly showed sites being
      # indexed. This is what let a stalled/failing run silently discard
      # already-completed work.
      - name: Generate static directory page
        if: always()
        run: |
          python generate_home.py
          python generate_directory.py
          python generate_components.py
          python generate_systems.py

      - name: Check crawl health (maintainer-facing only — not shown on the public page)
        if: always()
        run: python check_crawl_health.py

      - name: Open/update/close maintainer issue for low-coverage systems
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --search "Crawl health: low-coverage systems in:title" --state open --json number --jq '.[0].number')
          if [ -f health_report.md ]; then
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body-file health_report.md
            else
              gh issue create --title "Crawl health: low-coverage systems" --body-file health_report.md --label "crawl-health" || \
              gh issue create --title "Crawl health: low-coverage systems" --body-file health_report.md
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "All systems now have healthy crawl coverage — closing."
          fi

      - name: Commit discovered resources + directory page
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add systems.yaml home.html directory.html pages_index.json components systems
          if ! git diff --cached --quiet; then
            git commit -m "Auto-index new design systems + update directory page [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Deploy directory page to Netlify
        if: always()
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          mkdir -p site
          cp home.html site/index.html
          cp directory.html site/directory.html
          if [ -d screenshots ]; then cp -r screenshots site/screenshots; fi
          if [ -d components ]; then cp -r components site/components; fi
          if [ -d systems ]; then cp -r systems site/systems; fi
          npx --yes netlify-cli@17 deploy --site "$NETLIFY_SITE_ID" --dir=site --prod
