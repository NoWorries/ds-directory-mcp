name: Refresh signals on already-indexed systems

# Runs automatically whenever resources.py or content_signals.py changes —
# i.e. whenever a new detectable resource type or content signal is added
# (copilot-instructions, a governance-model detector, etc). Those are
# recomputed from freshly fetched page text/links on EVERY crawl regardless
# of ingest.py's per-page embed-skip optimization, so a --refresh --shallow
# pass (ingest.py's mode for "already-indexed systems only") is enough to
# backfill the new signal across every currently-indexed system without
# waiting for the monthly full reindex or paying for a full deep re-embed.
#
# Deliberately does NOT touch never-indexed systems (that's reindex-new.yml/
# reindex-shallow.yml's job) or do a deep crawl (that's reindex-full.yml,
# monthly) — this is specifically "the code that decides what a signal means
# changed, so re-check what's already here with it."

on:
  push:
    branches: [master]
    paths:
      - resources.py
      - content_signals.py
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

# Only one of these full-registry pipelines (reindex-full/new/shallow/
# signals-refresh/spa, plus this one) committing to master or deploying to
# Netlify at once — running two at a time doubled embedding-API 429s in practice
# and made their push-retry loops fight each other for no benefit.
concurrency:
  group: ds-directory-mcp-write-pipeline
  cancel-in-progress: false

jobs:
  # Was a fixed SHARD_COUNT=16 regardless of how many systems are actually
  # already-indexed right now — computed instead, same pattern as reindex-
  # new.yml/reindex-full.yml, so it can't overshoot into empty shards.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      shard_count: ${{ steps.gen.outputs.shard_count }}
      shards: ${{ steps.gen.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-site.txt
      - run: pip install -r requirements-site.txt
      - id: gen
        run: |
          python3 -c "
          import json
          import yaml

          with open('systems.yaml') as f:
              entries = yaml.safe_load(f) or []
          # Mirrors ingest.py's --refresh filter (already-indexed, not archived).
          total = len([e for e in entries if e.get('pages_indexed') and not e.get('archived')])
          n = max(min(total, 256), 1)
          print(f'shard_count={n}')
          print(f'shards={json.dumps(list(range(n)))}')
          " >> "$GITHUB_OUTPUT"

  refresh-shard:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ingest.txt

      - run: pip install -r requirements-ingest.txt

      - name: Shallow re-scan this shard's already-indexed systems
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          rm -f shard_touched.json
          python ingest.py --refresh --shallow --shard ${{ matrix.shard }}/${{ needs.prepare.outputs.shard_count }}

      # if: always() — same reasoning as every other sharded reindex workflow:
      # ingest.py writes systems.yaml/pages_index.json per system well before
      # that system's embedding calls, so whatever this shard got through
      # before any failure is already on disk and worth uploading.
      # shard_touched.json (see ingest.mark_shard_touched) tells
      # merge_shards.py which names to take from this shard specifically.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: |
            systems.yaml
            pages_index.json
            shard_touched.json
          retention-days: 1
          if-no-files-found: ignore

  merge-and-deploy:
    needs: [prepare, refresh-shard]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ingest.txt

      - run: pip install -r requirements-ingest.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards

      - name: Merge shard results into systems.yaml + pages_index.json
        run: python merge_shards.py ${{ needs.prepare.outputs.shard_count }}

      - name: Generate static directory page
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          python generate_home.py
          python generate_search.py
          python generate_forms.py
          python generate_data_export.py
          python generate_llms_txt.py
          python generate_mcp_manifest.py
          python generate_security_txt.py
          python generate_robots_txt.py
          python generate_directory.py
          python generate_components.py
          python generate_systems.py
          # sitemap.xml must run AFTER components/patterns/foundations are
          # generated above — it enumerates those directories' pages
          # (taxonomy_page_paths() in generate_sitemap.py).
          python generate_sitemap.py

      - name: Commit refreshed signals + directory page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add systems.yaml favicon.svg favicon-fallback.svg home.html directory.html search.html suggest.html report.html llms.txt systems.json design-system.schema.json pages_index.json components patterns foundations systems .well-known robots.txt
          if [ -f sitemap.xml ]; then git add sitemap.xml; fi
          if ! git diff --cached --quiet; then
            git commit -m "Refresh resource/content signals on already-indexed systems [skip ci]"
            for i in 1 2 3 4 5; do
              git push && break
              echo "Push rejected (attempt $i/5) — another commit landed first, rebasing and retrying..."
              git pull --rebase
            done
          else
            echo "No changes to commit"
          fi

      - name: Deploy directory page to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          bash scripts/build_site.sh
