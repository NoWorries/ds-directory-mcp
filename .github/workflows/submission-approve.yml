name: Approve design system submission

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

# Only one of these full-registry pipelines (reindex-full/new/shallow/
# signals-refresh/spa, plus this one) committing to master or deploying to
# Netlify at once — running two at a time doubled Jina 429s in practice
# and made their push-retry loops fight each other for no benefit.
concurrency:
  group: ds-directory-mcp-write-pipeline
  cancel-in-progress: false

jobs:
  approve:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ingest.txt

      - run: pip install -r requirements-ingest.txt

      - name: Add approved system to systems.yaml
        id: approve
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: echo "$ISSUE_BODY" | python approve_submission.py

      - name: Commit new registry entry
        env:
          # A submitter's free-text org/system name (approve_submission.py)
          # goes straight into these run: scripts, which hold contents:write
          # plus Qdrant/Jina/SMTP secrets — an org name like `"; curl ... | sh"`
          # would execute as shell if interpolated directly into the script
          # body. Passing it through env: and referencing it as a quoted
          # shell variable instead (same pattern already used for ISSUE_BODY
          # above) keeps it as inert data no matter what it contains.
          FULL_NAME: ${{ steps.approve.outputs.full_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add systems.yaml
          git diff --quiet --cached || git commit -m "Add $FULL_NAME to systems.yaml (approved via #$ISSUE_NUMBER)"
          # Other workflows commit to this same branch too, so a push can land
          # after one of them — ordinary non-fast-forward race, not a real
          # conflict most of the time. Rebase and retry a few times.
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected (attempt $i/5) — another commit landed first, rebasing and retrying..."
            git pull --rebase
          done

      - name: Ingest the newly approved system now
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          FULL_NAME: ${{ steps.approve.outputs.full_name }}
        run: python ingest.py --system "$FULL_NAME"

      # if: always() on these three — ingest.py writes systems.yaml/
      # pages_index.json right after crawling (before the embedding calls
      # that are where a failure like a Jina rate-limit actually happens), so
      # even if the ingest step above fails partway, this one system's
      # updated pages_indexed/resources are already on disk. Without
      # always(), a failed ingest step would skip straight past committing
      # and deploying it, silently discarding that progress when the runner
      # is torn down. "Comment and close"/the email below stay success-only
      # on purpose — don't tell the submitter it's live if it isn't.
      - name: Generate directory page
        if: always()
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          python generate_home.py
          python generate_search.py
          python generate_forms.py
          python generate_data_export.py
          python generate_llms_txt.py
          python generate_mcp_manifest.py
          python generate_security_txt.py
          python generate_robots_txt.py
          python generate_directory.py
          python generate_components.py
          python generate_systems.py
          # sitemap.xml must run AFTER components/patterns/foundations are
          # generated above — it enumerates those directories' pages
          # (taxonomy_page_paths() in generate_sitemap.py).
          python generate_sitemap.py

      - name: Commit updated registry stats + directory page
        if: always()
        env:
          FULL_NAME: ${{ steps.approve.outputs.full_name }}
        run: |
          git add systems.yaml favicon.svg favicon-fallback.svg home.html directory.html search.html suggest.html report.html llms.txt systems.json design-system.schema.json pages_index.json components patterns foundations systems .well-known robots.txt
          if [ -f sitemap.xml ]; then git add sitemap.xml; fi
          git diff --quiet --cached || git commit -m "Update directory page after approving $FULL_NAME [skip ci]"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected (attempt $i/5) — another commit landed first, rebasing and retrying..."
            git pull --rebase
          done

      - name: Deploy directory page to Netlify
        if: always()
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          bash scripts/build_site.sh

      - name: Comment and close the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "✅ Approved and indexed — now live in \`systems.yaml\` and the directory page. Thanks for the contribution!"
          gh issue close "${{ github.event.issue.number }}"

      - name: Email the submitter, if they asked for one
        if: steps.approve.outputs.notify_email != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "${{ steps.approve.outputs.full_name }} is now live in the Design System Directory"
          to: ${{ steps.approve.outputs.notify_email }}
          from: Design System Directory
          body: |
            Your submission, ${{ steps.approve.outputs.full_name }}, has been approved and indexed.

            It's now searchable and listed in the directory page.

            (This is a one-time notification — no mailing list, nothing stored beyond this issue.)
