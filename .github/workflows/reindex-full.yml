name: Full reindex (all design systems)

on:
  schedule:
    # 03:00 UTC on the 1st of each month — full re-crawl of every registered system,
    # regardless of whether anything looks changed. reindex-new.yml (weekly) covers
    # newly added registry entries in between.
    - cron: "0 3 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

# Only one of these full-registry pipelines (this, reindex-new, reindex-
# shallow, reindex-signals-refresh, reindex-spa) committing to master at once
# — two running concurrently doubled embedding-API 429s in practice and made the
# push-retry loops below fight each other for no benefit. Doesn't cancel an
# in-progress run just because another was queued (cancel-in-progress:
# false) — a --all run losing to a --new run over queue order would be a bad
# trade, it just waits its turn.
concurrency:
  group: ds-directory-mcp-write-pipeline
  cancel-in-progress: false

jobs:
  # One shard per registered system (capped at 256 — GitHub's hard matrix-size
  # limit) instead of a fixed small SHARD_COUNT: a shard's local progress only
  # survives if it reaches its own end-of-job artifact upload, and a forced
  # runner shutdown (GitHub killing the VM outright, not just failing a step)
  # gives it no chance to run that step at all — real indexing work has been
  # lost mid-shard this way more than once. One site per shard means a single
  # kill can only ever cost that one site's progress, not a whole batch's.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      shard_count: ${{ steps.gen.outputs.shard_count }}
      shards: ${{ steps.gen.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-site.txt
      - run: pip install -r requirements-site.txt
      - id: gen
        run: |
          python3 -c "
          import json
          import yaml

          with open('systems.yaml') as f:
              entries = yaml.safe_load(f) or []
          # Mirrors ingest.eligible_for_all() exactly (kept in sync by hand —
          # this job doesn't install ingest.py's heavier deps to import it
          # directly). Sharding on the raw entry count used to spin up ~72
          # empty shards every run: they'd install deps, run ingest.py --all,
          # find zero eligible systems in their slice, and exit — pure wasted
          # Actions minutes with nothing to show for it.
          eligible = [e for e in entries if not e.get('archived') and not e.get('likely_spa') and e.get('render_mode') != 'spa']
          n = min(len(eligible), 256)
          print(f'shard_count={n}')
          print(f'shards={json.dumps(list(range(n)))}')
          " >> "$GITHUB_OUTPUT"

  # Split into independent shards so a runner getting killed mid-run (cancellation,
  # quota, transient infra issue) only loses one shard's work, not the whole
  # run. Each shard writes straight to Qdrant (safe, no conflict across
  # shards) and uploads its own systems.yaml/pages_index.json as an artifact;
  # nothing is committed to git until the merge job combines them all.
  reindex-shard:
    needs: prepare
    strategy:
      fail-fast: false
      # GitHub also enforces a concurrent-jobs limit independent of the
      # Actions-minutes quota — capping how many of these run at once avoids
      # tripping it even with up to 256 shards queued.
      max-parallel: 4
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ingest.txt

      - run: pip install -r requirements-ingest.txt

      # Local embeddings (see embeddings.py) download their model weights
      # from HuggingFace on first use — cached here so up to 4 parallel
      # shards, and every subsequent scheduled run, don't each re-download
      # the same ~130MB.
      - name: Cache local embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ hashFiles('config.py') }}

      # ingest.py --all always force-crawls regardless of --force (see its
      # own comment on that) — there used to be a workflow_dispatch `force`
      # input here that did nothing whatsoever; removed rather than left as
      # a control that looked like it did something.
      - name: Re-ingest this shard's systems
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          rm -f shard_touched.json
          python ingest.py --all --shard ${{ matrix.shard }}/${{ needs.prepare.outputs.shard_count }}

      # if: always() is the whole point of sharding: ingest.py writes
      # systems.yaml/pages_index.json incrementally (after each system, well
      # before that system's embedding calls, which is where an embedding-API rate-limit
      # or any other mid-run failure actually happens) — so by the time this
      # shard's ingest step fails, the runner's local disk already reflects
      # every system it got through. Without always(), a failed step skips
      # every step after it by default, this upload never happens, and that
      # already-crawled progress is discarded the moment the runner is torn
      # down — which is exactly why sites that clearly got indexed (visible in
      # the job log) never showed up after a rebuild.
      #
      # shard_touched.json (see ingest.mark_shard_touched) is what tells
      # merge_shards.py which names to take FROM THIS shard specifically —
      # without it, merging fell back to diffing full-registry copies against
      # a moving base and got it wrong (see merge_shards.py's docstring).
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: |
            systems.yaml
            pages_index.json
            shard_touched.json
          retention-days: 1
          if-no-files-found: ignore

  merge-and-deploy:
    needs: [prepare, reindex-shard]
    # always() alone would also run this after `prepare` itself failed (bad
    # systems.yaml, a syntax error in the shard-count script) — shard_count
    # would then be empty/undefined and merge_shards.py has nothing sane to
    # do with it. Only skip on an actual prepare failure; still run when
    # prepare succeeded even if every shard failed, since there's still a
    # health report worth generating and any shard_touched progress worth
    # merging.
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ingest.txt

      - run: pip install -r requirements-ingest.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards

      - name: Merge shard results into systems.yaml + pages_index.json
        run: python merge_shards.py ${{ needs.prepare.outputs.shard_count }}

      - name: Generate static directory page
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          python generate_home.py
          python generate_search.py
          python generate_forms.py
          python generate_data_export.py
          python generate_llms_txt.py
          python generate_mcp_manifest.py
          python generate_security_txt.py
          python generate_robots_txt.py
          python generate_directory.py
          python generate_compare.py
          python generate_components.py
          python generate_systems.py
          # sitemap.xml must run AFTER components/patterns/foundations are
          # generated above — it enumerates those directories' pages
          # (taxonomy_page_paths() in generate_sitemap.py).
          python generate_sitemap.py

      - name: Check crawl health (maintainer-facing only — not shown on the public page)
        run: python check_crawl_health.py

      - name: Open/update/close maintainer issue for low-coverage systems
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --search "Crawl health: systems needing attention in:title" --state open --json number --jq '.[0].number')
          if [ -f health_report.md ]; then
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body-file health_report.md
            else
              gh issue create --title "Crawl health: systems needing attention" --body-file health_report.md --label "crawl-health" || \
              gh issue create --title "Crawl health: systems needing attention" --body-file health_report.md
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "All systems now have healthy crawl coverage — closing."
          fi

      - name: Commit discovered resources + directory page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add systems.yaml favicon.svg favicon-fallback.svg home.html directory.html compare.html search.html suggest.html report.html llms.txt systems.json design-system.schema.json pages_index.json dead_links.json components patterns foundations systems .well-known robots.txt
          if [ -f sitemap.xml ]; then git add sitemap.xml; fi
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update discovered resources and directory page [skip ci]"
            # Other workflows (submission-approve, reindex-new) commit to this
            # same branch too, so a push here can land after one of them —
            # "fetch first"/non-fast-forward, not a real conflict most of the
            # time. Rebase our one commit on top and retry a few times rather
            # than failing the whole job over an ordinary race. On the fifth
            # rejected attempt, abandon the rebase cleanly (leaving the
            # working tree usable) and upload this run's merged
            # systems.yaml/pages_index.json as a longer-lived artifact so a
            # maintainer can recover the crawl results by hand instead of
            # them just vanishing with the runner.
            pushed=false
            for i in 1 2 3 4 5; do
              if git push; then pushed=true; break; fi
              echo "Push rejected (attempt $i/5) — another commit landed first, rebasing and retrying..."
              git pull --rebase || { git rebase --abort; break; }
            done
            if [ "$pushed" != "true" ]; then
              echo "::warning::Could not push after 5 attempts — this run's crawl results were NOT committed. See the uploaded 'unmerged-crawl-results' artifact."
              touch .push_failed
            fi
          else
            echo "No changes to commit"
          fi

      # hashFiles() rather than failure()/steps.*.outcome: the commit step
      # above deliberately doesn't fail the job over a push conflict (that
      # would also skip the still-valid Netlify deploy below), so it signals
      # this instead via a marker file only the push-retry loop creates.
      - if: always() && hashFiles('.push_failed') != ''
        uses: actions/upload-artifact@v4
        with:
          name: unmerged-crawl-results
          path: |
            systems.yaml
            pages_index.json
          retention-days: 30

      - name: Deploy directory page to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          bash scripts/build_site.sh
