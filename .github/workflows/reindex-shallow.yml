name: Shallow reindex (breadth pass over unindexed systems)

# One-off (manually triggered) pass to get SOME real content into every
# never-before-indexed system quickly, rather than waiting for reindex-full's
# deep crawl to slowly work through the whole registry. Uses ingest.py's
# --shallow flag (see its docstring) to cap every crawl at SHALLOW_MAX_PAGES
# pages instead of each entry's normal max_pages/DEFAULT_MAX_PAGES — many
# systems get touched fast instead of a few systems getting crawled fully.
#
# Once a system is touched here it has a pages_indexed value like any other
# indexed system, so it stops being "unindexed" — a later reindex-full run
# re-crawls it at full depth exactly as it would any other already-indexed
# system. This workflow is meant to be run again whenever there's a fresh
# batch of unindexed systems worth a quick pass (e.g. right after a big bulk
# addition to systems.yaml) — it's a no-op if everything's already been
# touched at least once.

on:
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

env:
  # ~4 systems per shard (roughly 243 unindexed / 64) — a shard's local
  # progress only survives if it reaches its own end-of-job artifact upload,
  # and a forced runner shutdown (GitHub killing the VM outright, not just
  # failing a step) gives it no chance to run that step at all. Real
  # indexing work has been lost mid-shard this way more than once, so the
  # priority here is shrinking how much work is unprotected in-flight at any
  # moment, not crawling efficiency — max-parallel below keeps only 2 shards
  # actually running at a time regardless of how many are queued.
  SHARD_COUNT: 64

jobs:
  # Builds the [0, 1, ..., SHARD_COUNT-1] matrix from env.SHARD_COUNT instead
  # of hand-listing 64 numbers below — bump SHARD_COUNT above and this job
  # picks it up automatically.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.gen.outputs.shards }}
    steps:
      - id: gen
        run: echo "shards=$(python3 -c 'import json; print(json.dumps(list(range(${{ env.SHARD_COUNT }}))))')" >> "$GITHUB_OUTPUT"

  # Same sharding rationale as reindex-full.yml: a runner getting killed
  # mid-run only loses its slice, not the whole pass.
  shallow-shard:
    needs: prepare
    strategy:
      fail-fast: false
      # Caps how many shards run at once — GitHub also enforces a concurrent-
      # jobs limit independent of the Actions-minutes quota, and running too
      # many at once was a plausible way to trip it.
      max-parallel: 2
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ingest.txt

      - run: pip install -r requirements-ingest.txt

      - name: Shallow-crawl this shard's unindexed systems
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: python ingest.py --new --shallow --shard ${{ matrix.shard }}/${{ env.SHARD_COUNT }}

      # if: always() — same reasoning as reindex-full.yml: ingest.py writes
      # systems.yaml/pages_index.json incrementally per system, well before
      # that system's embedding calls (where a rate-limit or other failure
      # actually happens), so whatever this shard got through before any
      # failure is already on disk and worth uploading.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: |
            systems.yaml
            pages_index.json
          retention-days: 1

  merge-and-deploy:
    needs: shallow-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ingest.txt

      - run: pip install -r requirements-ingest.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards

      - name: Merge shard results into systems.yaml + pages_index.json
        run: python merge_shards.py ${{ env.SHARD_COUNT }}

      - name: Generate static directory page
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          python generate_home.py
          python generate_search.py
          python generate_forms.py
          python generate_data_export.py
          python generate_llms_txt.py
          python generate_sitemap.py
          python generate_directory.py
          python generate_components.py
          python generate_systems.py

      - name: Check crawl health (maintainer-facing only — not shown on the public page)
        run: python check_crawl_health.py

      - name: Open/update/close maintainer issue for low-coverage systems
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --search "Crawl health: systems needing attention in:title" --state open --json number --jq '.[0].number')
          if [ -f health_report.md ]; then
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body-file health_report.md
            else
              gh issue create --title "Crawl health: systems needing attention" --body-file health_report.md --label "crawl-health" || \
              gh issue create --title "Crawl health: systems needing attention" --body-file health_report.md
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "All systems now have healthy crawl coverage — closing."
          fi

      - name: Commit newly-touched systems + directory page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add systems.yaml home.html directory.html search.html suggest.html report.html llms.txt systems.json design-system.schema.json pages_index.json components systems
          if [ -f sitemap.xml ]; then git add sitemap.xml; fi
          if ! git diff --cached --quiet; then
            git commit -m "Shallow-index previously unindexed design systems [skip ci]"
            # Other workflows commit to this same branch too, so a push can
            # land after one of them — ordinary non-fast-forward race, not a
            # real conflict most of the time. Rebase and retry a few times.
            for i in 1 2 3 4 5; do
              git push && break
              echo "Push rejected (attempt $i/5) — another commit landed first, rebasing and retrying..."
              git pull --rebase
            done
          else
            echo "No changes to commit"
          fi

      - name: Deploy directory page to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          mkdir -p site
          cp home.html site/index.html
          cp search.html site/search.html
          cp suggest.html site/suggest.html
          cp report.html site/report.html
          cp llms.txt site/llms.txt
          if [ -f sitemap.xml ]; then cp sitemap.xml site/sitemap.xml; fi
          cp systems.json site/systems.json
          cp design-system.schema.json site/design-system.schema.json
          cp directory.html site/directory.html
          if [ -d screenshots ]; then cp -r screenshots site/screenshots; fi
          if [ -d components ]; then cp -r components site/components; fi
          if [ -d systems ]; then cp -r systems site/systems; fi
          npx --yes netlify-cli@17 deploy --site "$NETLIFY_SITE_ID" --dir=site --prod
