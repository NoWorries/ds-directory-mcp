name: Shallow reindex (breadth pass over unindexed systems)

# One-off (manually triggered) pass to get SOME real content into every
# never-before-indexed system quickly, rather than waiting for reindex-full's
# deep crawl to slowly work through the whole registry. Uses ingest.py's
# --shallow flag (see its docstring) to cap every crawl at SHALLOW_MAX_PAGES
# pages instead of each entry's normal max_pages/DEFAULT_MAX_PAGES — many
# systems get touched fast instead of a few systems getting crawled fully.
#
# Once a system is touched here it has a pages_indexed value like any other
# indexed system, so it stops being "unindexed" — a later reindex-full run
# re-crawls it at full depth exactly as it would any other already-indexed
# system. This workflow is meant to be run again whenever there's a fresh
# batch of unindexed systems worth a quick pass (e.g. right after a big bulk
# addition to systems.yaml) — it's a no-op if everything's already been
# touched at least once.

on:
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

# Only one of these full-registry pipelines (reindex-full/new/shallow/
# signals-refresh/spa, plus this one) committing to master or deploying to
# Netlify at once — running two at a time doubled embedding-API 429s in practice
# and made their push-retry loops fight each other for no benefit.
concurrency:
  group: ds-directory-mcp-write-pipeline
  cancel-in-progress: false

jobs:
  # Was a fixed SHARD_COUNT=64 (a guess: "~4 systems per shard" against
  # roughly 243 unindexed at the time it was written) — but the number of
  # never-indexed systems shrinks every time this or reindex-new.yml runs, so
  # a fixed count increasingly overshoots and spins up shards with nothing
  # to do (see reindex-full.yml's prepare job, which had the same problem at
  # a larger scale: ~72 empty shards in one real run). Computed the same way
  # reindex-new.yml is instead — one shard per currently-eligible system,
  # capped at 256.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      shard_count: ${{ steps.gen.outputs.shard_count }}
      shards: ${{ steps.gen.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-site.txt
      - run: pip install -r requirements-site.txt
      - id: gen
        run: |
          python3 -c "
          import json
          import yaml

          with open('systems.yaml') as f:
              entries = yaml.safe_load(f) or []
          # Mirrors ingest.py's --new filter (this runs --new --shallow).
          total = len([e for e in entries if 'pages_indexed' not in e and not e.get('archived')])
          n = max(min(total, 256), 1)
          print(f'shard_count={n}')
          print(f'shards={json.dumps(list(range(n)))}')
          " >> "$GITHUB_OUTPUT"

  # Same sharding rationale as reindex-full.yml: a runner getting killed
  # mid-run only loses its slice, not the whole pass.
  shallow-shard:
    needs: prepare
    strategy:
      fail-fast: false
      # Caps how many shards run at once — GitHub also enforces a concurrent-
      # jobs limit independent of the Actions-minutes quota, and running too
      # many at once was a plausible way to trip it.
      max-parallel: 2
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ingest.txt

      - run: pip install -r requirements-ingest.txt

      # Local embeddings (see embeddings.py) download their model weights
      # from HuggingFace on first use — cached here so up to 4 parallel
      # shards, and every subsequent scheduled run, don't each re-download
      # the same ~130MB.
      - name: Cache local embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ hashFiles('config.py') }}

      - name: Shallow-crawl this shard's unindexed systems
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          rm -f shard_touched.json
          python ingest.py --new --shallow --shard ${{ matrix.shard }}/${{ needs.prepare.outputs.shard_count }}

      # if: always() — same reasoning as reindex-full.yml: ingest.py writes
      # systems.yaml/pages_index.json incrementally per system, well before
      # that system's embedding calls (where a rate-limit or other failure
      # actually happens), so whatever this shard got through before any
      # failure is already on disk and worth uploading. shard_touched.json
      # (see ingest.mark_shard_touched) tells merge_shards.py which names to
      # take from this shard specifically.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: |
            systems.yaml
            pages_index.json
            shard_touched.json
          retention-days: 1
          if-no-files-found: ignore

  merge-and-deploy:
    needs: [prepare, shallow-shard]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ingest.txt

      - run: pip install -r requirements-ingest.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards

      - name: Merge shard results into systems.yaml + pages_index.json
        run: python merge_shards.py ${{ needs.prepare.outputs.shard_count }}

      - name: Generate static directory page
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          python generate_home.py
          python generate_search.py
          python generate_forms.py
          python generate_data_export.py
          python generate_llms_txt.py
          python generate_mcp_manifest.py
          python generate_security_txt.py
          python generate_robots_txt.py
          python generate_directory.py
          python generate_compare.py
          python generate_components.py
          python generate_systems.py
          # sitemap.xml must run AFTER components/patterns/foundations are
          # generated above — it enumerates those directories' pages
          # (taxonomy_page_paths() in generate_sitemap.py).
          python generate_sitemap.py

      - name: Check crawl health (maintainer-facing only — not shown on the public page)
        run: python check_crawl_health.py

      - name: Open/update/close maintainer issue for low-coverage systems
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --search "Crawl health: systems needing attention in:title" --state open --json number --jq '.[0].number')
          if [ -f health_report.md ]; then
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body-file health_report.md
            else
              gh issue create --title "Crawl health: systems needing attention" --body-file health_report.md --label "crawl-health" || \
              gh issue create --title "Crawl health: systems needing attention" --body-file health_report.md
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "All systems now have healthy crawl coverage — closing."
          fi

      - name: Commit newly-touched systems + directory page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add systems.yaml favicon.svg favicon-fallback.svg home.html directory.html compare.html search.html suggest.html report.html llms.txt systems.json design-system.schema.json pages_index.json dead_links.json components patterns foundations systems .well-known robots.txt
          if [ -f sitemap.xml ]; then git add sitemap.xml; fi
          if ! git diff --cached --quiet; then
            git commit -m "Shallow-index previously unindexed design systems [skip ci]"
            # Other workflows commit to this same branch too, so a push can
            # land after one of them — ordinary non-fast-forward race, not a
            # real conflict most of the time. Rebase and retry a few times.
            for i in 1 2 3 4 5; do
              git push && break
              echo "Push rejected (attempt $i/5) — another commit landed first, rebasing and retrying..."
              git pull --rebase
            done
          else
            echo "No changes to commit"
          fi

      - name: Deploy directory page to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          bash scripts/build_site.sh
