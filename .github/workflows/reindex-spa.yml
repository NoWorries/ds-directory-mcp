name: Reindex SPA sites (headless-render pass)

# For systems flagged likely_spa=True (see ingest.py's crawl() — a start URL
# that fetches fine but yields zero usable pages, and has no llms.txt to fall
# back on) — a plain requests+BeautifulSoup crawl only ever sees the pre-JS
# HTML shell of a client-side-rendered site, which has nothing real in it.
# This workflow re-renders just those systems' start URL through an actual
# headless browser (crawl4ai/Playwright) instead.
#
# Scheduled monthly (reindex-full.yml's --all deliberately EXCLUDES
# likely_spa systems now — a plain crawl already failed there once and
# would just fail identically again, so this headless-render pass is the
# only thing that can actually make progress on them) — without a schedule
# of its own, excluding them from --all would mean they're only ever
# re-checked if someone remembers to trigger this by hand.

on:
  schedule:
    # 03:00 UTC on the 15th of each month — offset from reindex-full.yml's
    # 1st-of-month run so the two heavy crawls don't compete for runners.
    - cron: "0 3 15 * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

# Only one of these full-registry pipelines (reindex-full/new/shallow/
# signals-refresh/spa, plus this one) committing to master or deploying to
# Netlify at once — running two at a time doubled embedding-API 429s in practice
# and made their push-retry loops fight each other for no benefit.
concurrency:
  group: ds-directory-mcp-write-pipeline
  cancel-in-progress: false

jobs:
  # One shard per likely_spa system (capped at 256, floored at 1) — same
  # rationale as the other reindex workflows: a shard's local progress only
  # survives if it reaches its own end-of-job artifact upload, and a forced
  # runner shutdown gives it no chance to run that step at all.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      shard_count: ${{ steps.gen.outputs.shard_count }}
      shards: ${{ steps.gen.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-site.txt
      - run: pip install -r requirements-site.txt
      - id: gen
        run: |
          python3 -c "
          import json
          import yaml

          with open('systems.yaml') as f:
              entries = yaml.safe_load(f) or []
          # Mirrors ingest.eligible_for_spa(): likely_spa (never successfully
          # rendered yet) OR render_mode == 'spa' (rendered before, needs
          # re-rendering periodically), excluding archived either way.
          total = len([e for e in entries if not e.get('archived') and (e.get('likely_spa') or e.get('render_mode') == 'spa')])
          n = max(min(total, 256), 1)
          print(f'shard_count={n}')
          print(f'shards={json.dumps(list(range(n)))}')
          " >> "$GITHUB_OUTPUT"

  spa-shard:
    needs: prepare
    strategy:
      fail-fast: false
      # Headless rendering is much heavier per-page than a plain GET, and
      # GitHub enforces a concurrent-jobs limit independent of the
      # Actions-minutes quota — keep this conservative.
      max-parallel: 2
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-spa.txt

      - run: pip install -r requirements-spa.txt

      # Local embeddings (see embeddings.py) download their model weights
      # from HuggingFace on first use — cached here so parallel shards, and
      # every subsequent scheduled run, don't each re-download the same
      # ~130MB.
      - name: Cache local embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ hashFiles('config.py') }}

      # crawl4ai wraps Playwright, which needs its own browser binary
      # installed separately from the pip package. Every one of up to 2
      # concurrently-running shards was reinstalling this ~300MB browser
      # from scratch every single run; caching it keyed on the pinned
      # crawl4ai/Playwright version (requirements-spa.txt) means only a
      # genuine version bump ever pays that cost again. Only really matters
      # for Playwright's OWN bundled downloads (firefox/webkit/chromium) —
      # channel installs like "chrome" below go through apt into /opt/
      # google/chrome instead, so this cache mostly just saves the browser-
      # driver/support files Playwright itself still keeps here.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-spa.txt') }}

      # "chrome" (a channel install via apt), NOT "chromium" (Playwright's
      # own bundled download) — see ingest._get_browser_config()'s
      # docstring for the full story: a bare downloaded Chromium binary has
      # no AppArmor profile at all and crashed with SIGTRAP on every single
      # render on this runner, confirmed even after disabling Ubuntu 24.04's
      # AppArmor unprivileged-userns restriction directly. Real installed
      # Google Chrome ships its own registered AppArmor profile
      # (/etc/apparmor.d/opt.google.chrome) and sidesteps the whole
      # problem.
      - run: playwright install --with-deps chrome

      # Confirmed live: every shard's render crashed identically with
      # "BrowserType.launch: Target page, context or browser has been
      # closed" / chrome-headless-shell exiting on SIGTRAP immediately on
      # launch, regardless of which system it was rendering or which
      # crawl4ai/Playwright version was pinned (same chromium_headless_
      # shell-1243 build either way) — not a per-site or version-drift
      # problem. Root cause: Ubuntu 24.04+'s ubuntu-latest runners restrict
      # unprivileged user-namespace creation via AppArmor by default (see
      # https://bugs.launchpad.net/ubuntu/+source/apparmor/+bug/2046844),
      # which crashes any Chromium binary that isn't a distro package (a
      # plain `playwright install` download, exactly what this is) in
      # ZygoteHostImpl::Init with "No usable sandbox!" — even with
      # --no-sandbox already on the launch command line, since the crash
      # happens during zygote setup before that flag's effect fully
      # applies. This sysctl only affects this ephemeral runner VM for the
      # rest of this job.
      - name: Allow unprivileged user namespaces (Ubuntu 24.04 AppArmor default breaks downloaded Chromium)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Render this shard's likely_spa systems
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          rm -f shard_touched.json
          python ingest.py --spa --shard ${{ matrix.shard }}/${{ needs.prepare.outputs.shard_count }}

      # shard_touched.json (see ingest.mark_shard_touched) tells
      # merge_shards.py which names to take from this shard specifically.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: |
            systems.yaml
            pages_index.json
            shard_touched.json
          retention-days: 1
          if-no-files-found: ignore

  merge-and-deploy:
    needs: [prepare, spa-shard]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-spa.txt

      - run: pip install -r requirements-spa.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards

      # Regenerates, commits, and pushes — retrying by re-merging and
      # re-regenerating fresh against the new remote tip on a push
      # rejection, NOT by git-rebasing the tree (see below for why).
      - name: Merge, regenerate, commit, and push (re-syncing on conflict)
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Everything from the shard merge through sitemap generation is
          # fully reproducible from systems.yaml/pages_index.json plus this
          # run's own downloaded shard artifacts (still on disk in ./shards)
          # — nothing here depends on which commit happens to be checked
          # out, so it's safe (and correct) to just run it again from
          # scratch against a newer base after a push rejection.
          regenerate() {
            python merge_shards.py ${{ needs.prepare.outputs.shard_count }}
            python generate_home.py
            python generate_search.py
            python generate_forms.py
            python generate_data_export.py
            python generate_llms_txt.py
            python generate_mcp_manifest.py
            python generate_security_txt.py
            python generate_robots_txt.py
            python generate_directory.py
            python generate_compare.py
            python generate_components.py
            python generate_systems.py
            # sitemap.xml must run AFTER components/patterns/foundations are
            # generated above — it enumerates those directories' pages
            # (taxonomy_page_paths() in generate_sitemap.py).
            python generate_sitemap.py
          }

          stage_and_commit() {
            git add systems.yaml favicon.svg favicon-fallback.svg home.html directory.html compare.html search.html suggest.html report.html llms.txt systems.json design-system.schema.json pages_index.json dead_links.json components patterns foundations systems .well-known robots.txt
            if [ -f sitemap.xml ]; then git add sitemap.xml; fi
            if git diff --cached --quiet; then
              return 1
            fi
            git commit -m "Render likely_spa design systems via headless browser [skip ci]"
          }

          regenerate

          if stage_and_commit; then
            pushed=false
            for i in 1 2 3 4 5; do
              if git push; then pushed=true; break; fi
              # Confirmed live: another writer (not always another shard of
              # THIS workflow — a separate agent/process entirely has
              # pushed to this same branch before) can land a commit with
              # its own independently-regenerated copy of the exact same
              # systems/*.json and *.html files this job also writes.
              # git pull --rebase then tries to line-merge two unrelated
              # renders of the same derived output and conflicts on
              # essentially every file — confirmed live, ~170 conflicts on
              # one real run, none of them a REAL disagreement (both sides
              # were regenerating the same kind of content from different
              # source data). The shard artifacts on disk are the actual
              # source of truth for what this run contributed, not the
              # failed commit itself — so instead of merging the tree,
              # reset straight to the new tip and rebuild from there:
              # merge_shards.py applies only the systems THIS run's shards
              # actually touched onto whatever base is currently checked
              # out, so re-running it against the latest remote state
              # incorporates the other writer's changes automatically,
              # loses nothing of theirs, and never hits a text conflict in
              # the first place.
              echo "Push rejected (attempt $i/5) — another commit landed first. Resetting to the new tip and re-merging/regenerating fresh, rather than rebasing the tree..."
              git fetch origin
              git reset --hard "origin/${{ github.ref_name }}"
              regenerate
              if ! stage_and_commit; then
                echo "Nothing left to push after re-merging onto the new tip."
                pushed=true
                break
              fi
            done
            if [ "$pushed" != "true" ]; then
              echo "::warning::Could not push after 5 attempts — this run's crawl results were NOT committed. See the uploaded 'unmerged-crawl-results' artifact."
              touch .push_failed
            fi
          else
            echo "No changes to commit"
          fi

      - if: always() && hashFiles('.push_failed') != ''
        uses: actions/upload-artifact@v4
        with:
          name: unmerged-crawl-results
          path: |
            systems.yaml
            pages_index.json
          retention-days: 30

      - name: Check crawl health (maintainer-facing only — not shown on the public page)
        run: python check_crawl_health.py

      - name: Open/update/close maintainer issue for low-coverage systems
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --search "Crawl health: systems needing attention in:title" --state open --json number --jq '.[0].number')
          if [ -f health_report.md ]; then
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body-file health_report.md
            else
              gh issue create --title "Crawl health: systems needing attention" --body-file health_report.md --label "crawl-health" || \
              gh issue create --title "Crawl health: systems needing attention" --body-file health_report.md
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "All systems now have healthy crawl coverage — closing."
          fi

      - name: Deploy directory page to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          bash scripts/build_site.sh
